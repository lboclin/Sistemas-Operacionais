name: Build and tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-debug
            compiler: gcc
            flags: ""
          - name: clang-debug
            compiler: clang
            flags: ""
          - name: gcc-asan-ubsan
            compiler: gcc
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
          - name: gcc-release
            compiler: gcc
            flags: ""
            build_type: Release
    env:
      CC: ${{ matrix.compiler }}
      CFLAGS: ${{ matrix.flags }}
      LDFLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type || 'Debug' }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Check Python and JavaScript syntax
        if: matrix.name == 'gcc-debug'
        run: |
          python3 -m compileall -q apps tools tests
          for file in apps/visual/static/*.js tests/visual/*.cjs; do node --check "$file"; done
      - name: Real Chromium browser E2E (compiled C engine)
        if: matrix.name == 'gcc-debug'
        run: |
          python3 -m venv .venv-e2e
          .venv-e2e/bin/python -m pip install 'playwright==1.56.0'
          .venv-e2e/bin/python -m playwright install chromium
          OSLLM_CLI="$PWD/build/os_llm_cli" OSLLM_RACE="$PWD/build/os_llm_race_lab" OSLLM_DEADLOCK="$PWD/build/os_llm_deadlock_lab" .venv-e2e/bin/python -m unittest discover -s tests/visual -p test_browser_e2e.py -v
      - name: Repeat concurrency, replay and acceptance regression tests
        if: matrix.name == 'gcc-debug'
        run: >-
          ctest --test-dir build --output-on-failure --repeat until-fail:6
          -R '^(work_queue|thread_pool|parallel_runtime|deadlock_liveness|ipc_runtime_rr|ipc_runtime_fcfs|trace_replay|page_fault_latency|final_acceptance_py)$'
