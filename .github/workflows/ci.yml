name: Build and tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-debug
            compiler: gcc
            flags: ""
          - name: clang-debug
            compiler: clang
            flags: ""
          - name: gcc-asan-ubsan
            compiler: gcc
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
    env:
      CC: ${{ matrix.compiler }}
      CFLAGS: ${{ matrix.flags }}
      LDFLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
